[package]
name = "syggrel-mrs"
version = "0.1.0"
authors = ["Suvorrow <suvoraum@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.3", features = ["router"] }
# Core mathematical computing
ndarray = "0.17.2"
numpy = "0.28.0"
nalgebra = "0.34.1"
petgraph = "0.8.3"
pyo3 = { version = "=0.28.2", features = ["abi3-py311"], default-features = false }
statrs = "0.18.0"
tao = "0.34.5"

# Image processing
image = "0.25.9"
imageproc = "0.26.0"

# Serialization and configuration
serde ={ version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0.18"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Performance
rayon = "1.10"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
