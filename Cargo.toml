# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "2"
members = [
    "crates/mrs_app",
    "crates/core",
    "crates/file_picker",
    "crates/mrs_exploring_kit",
    "crates/parser",
    "crates/serializer",
    "crates/ui",
]
default-members = ["crates/mrs_app"]

[workspace.package]
version = "0.1.0"
rust-version = "1.85"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Mikhail Suvorau (Suvorrow) <suvoraum@gmail.com>"]

[workspace.dependencies]
#================ Workspace member crates ================
mrs_app = { path = "crates/mrs_app" }
core = { path = "crates/core" }
file_picker = { path = "crates/file_picker" }
mrs_exploring_kit = { path = "crates/mrs_exploring_kit" }
parser = { path = "crates/parser" }
serializer = { path = "crates/serializer" }
ui = { path = "crates/ui" }

#================ External crates ================
#================ Dioxus (UI framework) ================
dioxus = { version = "0.7", features = ["router", "desktop"] }
dioxus-desktop = { version = "0.7", features = ["transparent"] }
dioxus-router = "0.7"

#================ Windowing / event loop ================
tao = "0.35"

#================ HDF5 for .hic-like parsers ================
hdf5 = { package = "hdf5-metno", version = "0.12.4" }
hdf5-sys = "0.8"

#================ Core mathematical computing ================
ndarray = "0.17"
nalgebra = "0.34"
petgraph = "0.8"
statrs = "0.18"

#================ Python interop ================
numpy = "0.28"
pyo3 = { version = "=0.28.3", features = ["abi3-py311"], default-features = false }

#================ Image processing ================
image = "0.25"
imageproc = "0.26"

#================ Serialization and configuration ================
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "3.0"
csv = "1.4"
ndarray-npy = "0.10"

#================ Utilities ================
itertools = "0.14"
rfd = "0.17"

#================ Build tooling (for SCSS compilation) ================
rsass = "0.29"
glob = "0.3"

#================ Error handling ================
thiserror = "2.0.18"

#================ Logging ================
tracing = "0.1"
tracing-subscriber = "0.3.23"

#================ Performance ================
rayon = "1.12"

#================ Dev dependencies ================
tokio-test = "0.4"
