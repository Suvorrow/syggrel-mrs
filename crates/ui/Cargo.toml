[package]
name = "ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Dioxus-based user interface components for Prexager project"

[lints]
workspace = true

[lib]
path = "src/ui.rs"
doctest = false

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[dependencies]
#================ Dioxus framework ================
dioxus = { workspace = true, features = ["router"] }
dioxus-desktop = { workspace = true, features = ["transparent"] }
dioxus-router.workspace = true

#================ Workspace crates
file_picker.workspace = true
math_exploring_kit.workspace = true
parser.workspace = true

[build-dependencies]
rsass.workspace = true
glob.workspace = true
