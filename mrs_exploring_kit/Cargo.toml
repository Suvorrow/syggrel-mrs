[package]
name = "mrs_exploring_kit"
edition = "2024"
version.workspace = true
rust-version.workspace = true
description = "Mathematical and genomic parsing utilities for Syggrel-MRS project"

[dependencies]
itertools = { workspace = true }
thiserror = { workspace = true }

ndarray ={ workspace = true }
ndarray-npy = { workspace = true, optional = true }

# Output format support (feature-gated to minimize deps)
bincode = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
hdf5 = { workspace = true }

serde ={ workspace = true, features = ["derive"], optional = true }

[features]
default = ["serializer-csv"]

serializer-csv = ["dep:csv"]

serializer-npy = ["dep:ndarray-npy"]
serializer-hdf5 = []
serializer-bincode = ["dep:bincode"]

serde = ["dep:serde"]

# Enable all formats at once
serializer-all = [
    "serializer-csv",
    "serializer-npy",
    "serializer-hdf5",
    "serializer-bincode",
]
